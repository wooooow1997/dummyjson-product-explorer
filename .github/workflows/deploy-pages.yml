name: Deploy to GitHub Pages

# Publishes the existing Vite production build to GitHub Pages.
# The app already builds with `base: './'` (see vite.config.js), so it works
# unchanged from the project sub-path /dummyjson-product-explorer/ — no
# Pages-specific build configuration is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, publish Pages, and mint the OIDC token that
# actions/deploy-pages uses to authenticate the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue rather than cancel so an in-flight
# publish is allowed to finish cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
